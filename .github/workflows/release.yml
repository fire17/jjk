name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to package
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must be vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          version="${REQUESTED_TAG#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$manifest_version" || {
            echo "tag $REQUESTED_TAG does not match Cargo.toml $manifest_version" >&2
            exit 1
          }
          test "$(git tag --points-at HEAD | grep -Fx "$REQUESTED_TAG")" = "$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Test release source
        run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
            binary: jjk
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            binary: jjk
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset: darwin-x64
            binary: jjk
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: darwin-arm64
            binary: jjk
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
            binary: jjk.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="jjk-${TAG}-${ASSET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$BINARY" "dist/$name/$BINARY"
          cp LICENSE README.md "dist/$name/"
          if [ "$ARCHIVE" = zip ]; then
            (cd dist && 7z a -tzip "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/jjk-${{ needs.validate.outputs.tag }}-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Checksums, provenance, and GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/jjk-${{ needs.validate.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksum files
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for artifact in jjk-*.tar.gz jjk-*.zip; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
          sha256sum jjk-*.tar.gz jjk-*.zip "jjk-${{ needs.validate.outputs.tag }}.spdx.json" > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/jjk-*.tar.gz
            dist/jjk-*.zip
            dist/jjk-*.spdx.json
            dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "JJK $TAG"
