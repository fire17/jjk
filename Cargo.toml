[package]
name = "jjk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "State-first development for humans and agents"
license = "MIT"
repository = "https://github.com/fire17/jjk"
keywords = ["git", "jujutsu", "version-control", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
default-run = "jjk"

[lib]
name = "jjk"
path = "src/lib.rs"

[[bin]]
name = "jjk"
path = "src/main.rs"

[features]
default = ["sqlite-bundled"]
sqlite-bundled = ["rusqlite/bundled"]
jj = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", default-features = false, features = ["backup", "modern_sqlite", "uuid"] }
schemars = { version = "1.0", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.7"
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
